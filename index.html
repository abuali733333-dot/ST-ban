<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST Ban</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0a0a0a;
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.bg{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(135deg,#111,#000);
z-index:-1;
}

.card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
padding:40px;
border-radius:25px;
text-align:center;
width:400px;
box-shadow:0 0 30px rgba(0,0,0,0.5);
animation:fade 1s ease;
}

.card h1{
font-size:50px;
margin-bottom:10px;
color:#8b5cf6;
}

.card p{
opacity:0.7;
margin-bottom:25px;
}

.btn{
display:inline-block;
padding:12px 30px;
background:#8b5cf6;
color:white;
text-decoration:none;
border-radius:12px;
transition:0.3s;
}

.btn:hover{
transform:scale(1.05);
background:#a78bfa;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>

</head>
<body>

<div class="bg"></div>

<div class="card">
<h1>نظام المخالفات و العواقب</h1>
<p>المرجع الاساسي لباندات السيرفر</p>
<a class="btn" href="violations.html">عرض المخالفات</a>
</div>

</body>
</html>
