<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StormTown Ban</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahome;
}

body{
background:#050b16;
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.bg{
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(circle at top,#0f3b82 0%,#08111f 35%,#050b16 100%);
z-index:-1;
}

.card{
background:rgba(12,18,35,0.75);
backdrop-filter:blur(12px);
border:1px solid rgba(59,130,246,0.25);
padding:45px;
border-radius:30px;
text-align:center;
width:430px;
box-shadow:
0 0 25px rgba(37,99,235,0.25),
0 0 60px rgba(37,99,235,0.10);
animation:fade 1s ease;
}

.logo{
width:140px;
margin-bottom:15px;
filter:drop-shadow(0 0 20px rgba(59,130,246,0.8));
}

.server-name{
font-size:38px;
font-weight:bold;
margin-bottom:20px;
color:#60a5fa;
text-shadow:0 0 15px rgba(59,130,246,0.8);
}

.card h1{
font-size:42px;
line-height:1.5;
margin-bottom:15px;
color:#3b82f6;
}

.card p{
opacity:0.8;
font-size:16px;
margin-bottom:30px;
color:#cbd5e1;
}

.btn{
display:inline-block;
padding:14px 38px;
background:linear-gradient(135deg,#2563eb,#3b82f6);
color:white;
text-decoration:none;
border-radius:14px;
font-size:17px;
font-weight:bold;
transition:0.3s;
box-shadow:0 0 15px rgba(59,130,246,0.4);
}

.btn:hover{
transform:scale(1.07);
background:linear-gradient(135deg,#3b82f6,#60a5fa);
box-shadow:0 0 25px rgba(59,130,246,0.7);
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="card">

<img src="stormtown.png" class="logo">

<div class="server-name">
StormTown
</div>

<h1>نظام المخالفات و العواقب</h1>

<p>
المرجع الأساسي لباندات وقوانين السيرفر
</p>

<a class="btn" href="violations.html">
عرض المخالفات
</a>

</div>

</body>
</html>
